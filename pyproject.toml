[tool.ruff]
# Matches your previous autopep8 preference
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort (import sorting)
# B: flake8-bugbear (catches common Django/Python bugs)
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.lint.isort]
# This keeps your Django imports organized correctly
combine-as-imports = true
force-single-line = false

[tool.ruff.lint.per-file-ignores]
# Django migrations are often auto-generated and messy; ignore line length there
"**/migrations/*" = ["E501"]
# Apps.py often has "unused" imports for signals
"**/apps.py" = ["F401"]
# Settings files often have "star" imports or long strings
"settings.json" = ["E501"]
